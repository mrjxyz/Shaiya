; =============================================================================
; Data\SequenceItemCreate.ini
; =============================================================================
; IMPORTANT LIMIT:
;   - Grade (the WORD passed into the function) must be 1..99.
;   - If Grade is 0 or > 99, the function returns 0 (no item).  (CMP Grade,63 / JA)
;
; HOW A GROUP IS CHOSEN:
;   - The game scans SEQUENCE_GROUP_1 .. SEQUENCE_GROUP_COUNT in order.
;   - For each group it checks: (EBX % SEQUENCE) == 0
;   - The FIRST matching group wins.
;   - SEQUENCE is NOT a percentage. It is a divisibility rule on EBX.
;
; HOW GRADE_0..GRADE_9 IS PICKED:
;   - slotIndex = Grade / 10  -> 0..9   (1-9 => 0, 10-19 => 1, ..., 90-99 => 9)
;   - It reads GRADE_slotIndex from the selected group.
;   - That value is an "Item Grade ID" (NOT an itemId).
;   - The grade ID is then resolved to a real item using the grade table
;     (your screenshot: 17 -> 229, 18 -> 230, 19 -> 231).
;   - In this state, it works like a global drop system; no matter which mob you kill, it performs these checks and drops accordingly.
; =============================================================================

[SEQUENCE_GROUP_COUNT]
COUNT=3

; -------------------------------------------------------------------------
; GROUP 1: 20 EP (Grade 19) - rare
; triggers when (EBX % 230)==0  (rarity depends on EBX)
; -------------------------------------------------------------------------
[SEQUENCE_GROUP_1]
SEQUENCE=230          
GRADE_0=19
GRADE_1=19
GRADE_2=19
GRADE_3=19
GRADE_4=19
GRADE_5=19
GRADE_6=19
GRADE_7=19
GRADE_8=19
GRADE_9=19


; -------------------------------------------------------------------------
; GROUP 2: 10 EP (Grade 18) - less rare
; triggers when (EBX % 25)==0, but only if group1 did not match
; -------------------------------------------------------------------------
[SEQUENCE_GROUP_2]
SEQUENCE=25           
GRADE_0=18
GRADE_1=18
GRADE_2=18
GRADE_3=18
GRADE_4=18
GRADE_5=18
GRADE_6=18
GRADE_7=18
GRADE_8=18
GRADE_9=18


; -------------------------------------------------------------------------
; GROUP 3: 3 EP (Grade 17) - fallback
; triggers when (EBX % 5)==0, but only if group1 did not match
; -------------------------------------------------------------------------
[SEQUENCE_GROUP_3]
SEQUENCE=5
GRADE_0=17
GRADE_1=17
GRADE_2=17
GRADE_3=17
GRADE_4=17
GRADE_5=17
GRADE_6=17
GRADE_7=17
GRADE_8=17
GRADE_9=17
